[tools]
python = "3.12.12"
node = "22.23.1"
gitleaks = "8.30.1"

[tasks.bootstrap]
description = "Install development dependencies and prepare Paymenter 1.5.9"
run = "python3 scripts/bootstrap.py"

[tasks.check]
description = "Run fast offline checks"
run = "python3 scripts/test.py --suite lint --suite package --suite provider"

[tasks.test]
description = "Run all offline suites against the development app"
run = "python3 scripts/dev.py test"

[tasks.build]
description = "Build a release ZIP and member manifest"
run = "python3 scripts/dev.py build"

[tasks."check:public"]
description = "Scan full Git history and the built ZIP for secrets"
run = "python3 scripts/dev.py public"
