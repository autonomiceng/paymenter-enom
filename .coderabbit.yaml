# CodeRabbit configuration. Schema: https://coderabbit.ai/integrations/schema.v2.json
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
tone_instructions: "Be direct and specific. Use plain, industry-standard language. Point to the exact line and suggest a concrete fix."
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # Pull requests are stacked: each one targets the branch below it, not only main.
    base_branches:
      - ".*"
  path_filters:
    - "!dist/**"
    - "!**/*.zip"
  path_instructions:
    - path: "**"
      instructions: |
        This is a public open-source repository. Flag anything that should not be public:
        credentials, tokens, private keys, real hostnames, IP addresses, server paths,
        database names, personal email addresses, or customer data. Examples and test data
        must use reserved names from RFC 2606/6761 (example.com, example.net, example.org,
        .invalid, .test, .example) for emails and hosts. Clearly synthetic labels are allowed
        when a test exercises a specific real ending. Use documentation IP ranges, except
        when validation requires an address the product accepts as public; see
        tests/public-addresses.php. Use placeholder values for other identifiers.
    - path: "Enom/**"
      instructions: |
        Paymenter domain registrar extension (Laravel/PHP) for the Enom reseller API. Check
        authorization, input validation, idempotent order and renewal handling, correct money
        and currency math, safe retries, and that API credentials never reach logs or views.
    - path: "Enom/**/*.blade.php"
      instructions: |
        Check escaping of user and API data, accessibility (labels, contrast, keyboard use),
        and clear, plain UI text.
    - path: "tests/**"
      instructions: |
        Check that tests assert real behavior and cover failure paths, not only the happy path.
chat:
  auto_reply: true
